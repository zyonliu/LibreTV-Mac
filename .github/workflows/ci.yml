name: ci

# JavaScript source checks only. Native/PKG release gates run on macOS via scripts/.
# Desktop v1.x tags must not trigger upstream Docker or Core publication.

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read desktop runtime version
        id: runtime
        run: echo "version=$(node -p 'require(\"./scripts/runtime-config.json\").nodeVersion')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.version }}
          cache: npm

      - run: npm ci --ignore-scripts --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        env:
          LIBRETV_REQUIRE_NETWORK_TESTS: '1'
          LIBRETV_TEST_PUBLIC_URL: https://registry.npmjs.org/-/ping
        run: npm test
